<!doctype html>
<html lang="zh-Hans">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{FUNNEL_TITLE}}</title>
<style>
:root{color-scheme:light;--canvas:#f3f4f6;--paper:#fff;--ink:#202329;--muted:#59616d;--line:#e5e8ed;--blue:#155eaa;--wash:#f3f6fb;--band:#7ca5dd;font:15px/1.55 -apple-system,BlinkMacSystemFont,system-ui,sans-serif}
*{box-sizing:border-box}body{margin:0;background:var(--canvas);color:var(--ink);overflow-wrap:anywhere}main{max-width:1160px;margin:auto;padding:24px 30px 44px}
header,section{background:var(--paper);border:1px solid var(--line);border-radius:17px;box-shadow:0 2px 8px #252c3b08;padding:20px 24px;margin-bottom:14px}
h1,h2,h3,p{margin:0}h1{font-size:clamp(28px,4vw,42px);letter-spacing:-.045em;line-height:1.2}h2{font-size:19px;margin-bottom:10px}h3{font-size:15px}
.report-header{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,.9fr);align-items:center;gap:14px 20px}
.report-identity{display:flex;align-items:center;gap:13px;min-width:0}
.report-product-icon{width:52px;height:52px;border-radius:12px;border:1px solid var(--line);object-fit:cover;flex:none}
.report-kind{color:var(--blue);font-size:13px;font-weight:650;margin-bottom:4px}
.report-scope{display:grid;gap:3px;margin:0;justify-self:end;font-size:13px;font-variant-numeric:tabular-nums}
.report-scope>div{display:grid;grid-template-columns:4.5em minmax(0,1fr);gap:9px}
.report-scope dt{color:var(--muted);white-space:nowrap}.report-scope dd{margin:0;font-weight:600}
.report-period{justify-self:end;color:var(--muted);font-size:14px;font-weight:600;font-variant-numeric:tabular-nums}
.report-period time{white-space:nowrap}
.report-context{grid-column:1/-1;border-top:1px solid var(--line);padding-top:9px;color:var(--muted);font-size:13px}
.lead{position:relative;margin:0 0 10px;padding:13px 16px 13px 43px;border-radius:10px;background:var(--wash);color:#273746}
.lead span{position:absolute;top:0;left:11px;font:700 50px/1 Georgia,serif;color:#c9d8eb}
.findings{display:flex;flex-wrap:wrap;gap:8px;padding:0;margin:0;list-style:none}
.findings li{flex:1 1 230px;background:#f5f7fa;border-radius:8px;padding:8px 10px;font-size:13px}
.metric-grid,.funnel-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(230px,100%),1fr));gap:12px}
.metric-card,.funnel-card{border:1px solid var(--line);border-radius:11px;padding:13px 14px;background:#fafbfd;min-width:0}
.metric-card strong{display:block;font-weight:750;font-size:clamp(26px,4vw,36px);line-height:1.2;margin:3px 0;color:var(--blue)}
.metric-card p,.caption,.loss{color:var(--muted);font-size:13px}.caption{margin:-4px 0 10px}
.funnel-card h3{margin-bottom:10px}.funnel-stages{list-style:none;margin:0;padding:0;font-variant-numeric:tabular-nums}
.stage-label{display:flex;justify-content:space-between;gap:10px;font-size:13px;margin-bottom:4px}.stage-label strong{white-space:nowrap}
.band-track{display:flex;align-items:center;justify-content:center;height:28px;border-radius:7px;background:#eef2f7}
.band{width:var(--share);height:100%;border-radius:5px;background:var(--band)}
.band-unavailable{width:100%;height:100%;border:1px dashed #afb8c6;border-radius:7px}
.transition{margin:5px 0;color:var(--muted);text-align:center;font-size:12px}
.table-wrap{overflow:auto}table{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums}
th,td{text-align:left;vertical-align:top;padding:7px 9px;border-bottom:1px solid var(--line);min-width:96px}
thead th{color:var(--muted);font-size:13px;background:#f7f8fa}tbody tr:last-child>*{border-bottom:0}.loss{display:block;white-space:nowrap}
.step-count{color:var(--blue)}
.card-detail{margin:14px 0 6px}.trend-chart{max-width:740px;margin-bottom:12px}.trend-chart svg{display:block;width:100%;height:auto}
.trend-grid{fill:none;stroke:var(--line)}.trend-series polyline{stroke:var(--tone);fill:none;stroke-width:2.3;stroke-linecap:round;stroke-linejoin:round;vector-effect:non-scaling-stroke}.trend-series circle{fill:var(--tone)}
.trend-series .trend-gap{stroke-dasharray:5 4;opacity:.6}
.trend-chart linearGradient stop{stop-color:var(--tone)}
.trend-axis{fill:none;stroke:#aab4c2;vector-effect:non-scaling-stroke}
.trend-date,.trend-value{fill:var(--muted);font-size:13px;font-variant-numeric:tabular-nums}
@media(max-width:520px){.trend-date-inner{display:none}.trend-date,.trend-value{font-size:16px}}
.card-heading{display:flex;align-items:baseline;justify-content:space-between;flex-wrap:wrap;gap:4px 12px;margin-bottom:10px}
.card-heading h2{margin:0}.card-heading time{color:var(--muted);font-size:13px;white-space:nowrap}
.trend-legend{display:flex;flex-wrap:wrap;gap:4px 14px;list-style:none;padding:0;margin:5px 0 0;font-size:13px}
.trend-legend li:before{content:"";display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:5px;background:var(--tone)}
.tone-cyan{--tone:#009bc7}.tone-gold{--tone:#e2a118}.tone-pink{--tone:#f23877}.tone-violet{--tone:#6859e8}
.tone-graphite{--tone:#303038}.tone-crimson{--tone:#bd1234}.tone-gray{--tone:#737783}
@media(max-width:560px){main{padding:14px 12px 32px}header,section{padding:15px}.report-header{grid-template-columns:minmax(0,1fr);gap:10px}.report-scope,.report-period{justify-self:start}.report-product-icon{width:42px;height:42px}}
</style>
</head>
<body><main>{{FUNNEL_CONTENT}}</main></body>
</html>
