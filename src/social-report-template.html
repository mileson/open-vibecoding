<style>

h1,h2,p{margin:0}h1{font-size:clamp(25px,4vw,39px);letter-spacing:-.045em;line-height:1.2}h2{font-size:21px;line-height:1.25}.muted{color:var(--muted);font-size:13px}

<script>
const platform = document.querySelector('#platform');
const topic = document.querySelector('#topic');
const emotion = document.querySelector('#emotion');
const keyword = document.querySelector('#keyword');
const filters = [platform, topic, emotion, keyword];
const stream = document.querySelector('#message-stream');
const resetFilters = document.querySelector('#reset-filters');
const emptyMessage = document.querySelector('#message-empty');
const quotes = Array.from(document.querySelectorAll('.quotes li'));
const cloud = document.querySelector('#cloud-words');
const cloudData = JSON.parse(document.querySelector('#word-cloud-data').textContent);
const words = [...cloudData.terms].sort((a, b) => b.ratio - a.ratio);
const rowsByWord = new Map(words.map(entry => [entry.word, new Set(entry.commentRows)]));
const maxRatio = words[0]?.ratio || 1;
const tierSizes = {high:32, mid:21, low:15};
const percent = new Intl.NumberFormat('zh-CN', {style:'percent', maximumFractionDigits:1});

for (const entry of words) {
  keyword.add(new Option(entry.word, entry.word));
  const word = document.createElement('span');
  word.className = 'cloud-word';
  word.textContent = entry.word;
  word.title = entry.commentRows.length + ' 条评论提及 · ' + percent.format(entry.ratio);
  const relativeRatio = entry.ratio / maxRatio;
  word.dataset.tier = relativeRatio >= 2 / 3 ? 'high' : relativeRatio >= 1 / 3 ? 'mid' : 'low';
  cloud.append(word);
}
if (words.length === 0) cloud.textContent = '暂无可显示的关键词';

function fitWordCloud() {
  if (!words.length) return;
  const width = cloud.clientWidth;
  const height = cloud.clientHeight;
  const labels = [...cloud.querySelectorAll('.cloud-word')];
  cloud.classList.remove('is-flowing');
  cloud.classList.add('is-positioned');

  for (const scale of [1, .9, .8, .7]) {
    for (const label of labels) {
      const size = tierSizes[label.dataset.tier] * scale;
      label.style.setProperty('--word-size', Math.max(12, size).toFixed(2) + 'px');
    }
    const sizes = labels.map(label => [label.offsetWidth, label.offsetHeight]);
    const placed = [];
    for (const [index, [w, h]] of sizes.entries()) {
      for (let step = 0; step < 1800; step += 1) {
        const angle = step * .51;
        const radius = 5 * Math.sqrt(step);
        const dx = Math.cos(angle) * radius * width / height;
        const dy = Math.sin(angle) * radius;
        if (((Math.abs(dx) + w / 2 + 3) / (width / 2)) ** 2 +
            ((Math.abs(dy) + h / 2 + 3) / (height / 2)) ** 2 > 1) continue;
        const x = width / 2 + dx - w / 2;
        const y = height / 2 + dy - h / 2;
        if (placed.some(rect => x < rect.x + rect.w + 5 && x + w + 5 > rect.x &&
                               y < rect.y + rect.h + 5 && y + h + 5 > rect.y)) continue;
        placed.push({x,y,w,h});
        labels[index].style.left = x + 'px';
        labels[index].style.top = y + 'px';
        break;
      }
      if (placed.length !== index + 1) break;
    }
    if (placed.length === words.length) return;
  }
  cloud.classList.remove('is-positioned');
  cloud.classList.add('is-flowing');
}
document.fonts.ready.then(fitWordCloud);
new ResizeObserver(fitWordCloud).observe(cloud);
const filterPickers = new Map();
const platformIcons = new Map([...document.querySelectorAll('.mood-platform h4')].map(
  heading => [heading.dataset.label, heading.querySelector('img')]
));
const emotionIcons = new Map([...document.querySelectorAll('.mood-overview .mood-tile')].map(
  tile => [tile.dataset.emotion, tile.querySelector('img')]
));
for (const quote of quotes) {
  const icon = emotionIcons.get(quote.dataset.e);
  const badge = quote.querySelector('.emotion-tag');
  if (!icon || !badge) continue;
  const avatar = icon.cloneNode();
  avatar.className = 'emotion-avatar';
  badge.prepend(avatar);
}
let openPicker = null;

function closePicker(restoreFocus = false) {
  if (!openPicker) return;
  const {trigger, menu} = openPicker;
  openPicker = null;
  menu.hidden = true;
  trigger.setAttribute('aria-expanded', 'false');
  if (restoreFocus) trigger.focus({preventScroll:true});
}

function selectedValues(control) {
  return [...control.selectedOptions].map(option => option.value).filter(Boolean);
}

function normalizeSearch(text) {
  return text.normalize('NFKC').toLowerCase().replace(/\s+/gu, '');
}

function matchesOption(text, query) {
  if (!query) return true;
  const chars = [...query];
  let matched = 0;
  for (const char of normalizeSearch(text)) {
    if (char === chars[matched]) matched += 1;
    if (matched === chars.length) return true;
  }
  return false;
}

function filterOptions(picker) {
  const query = normalizeSearch(picker.search.value);
  let found = false;
  for (const item of picker.options) {
    item.hidden = Boolean(query) && (!item.dataset.value || !matchesOption(item.textContent, query));
    found ||= !item.hidden;
  }
  picker.empty.hidden = found;
}

function showPicker(picker, focusLast = false) {
  closePicker();
  const {trigger, menu, options, search} = picker;
  openPicker = picker;
  menu.hidden = false;
  trigger.setAttribute('aria-expanded', 'true');
  menu.style.left = '0';
  menu.style.removeProperty('--menu-list-height');
  menu.classList.remove('opens-up');
  const triggerBox = trigger.getBoundingClientRect();
  const below = document.documentElement.clientHeight - triggerBox.bottom - 16;
  const above = triggerBox.top - 16;
  const opensUp = menu.offsetHeight > below && above > below;
  menu.classList.toggle('opens-up', opensUp);
  const list = menu.querySelector('.filter-options');
  const chrome = menu.offsetHeight - list.offsetHeight;
  menu.style.setProperty('--menu-list-height', Math.max(64, (opensUp ? above : below) - chrome) + 'px');
  const overflow = menu.getBoundingClientRect().right - document.documentElement.clientWidth + 8;
  if (overflow > 0) menu.style.left = -overflow + 'px';
  if (search) {
    search.value = '';
    filterOptions(picker);
    search.focus({preventScroll:true});
    return;
  }
  const selected = focusLast ? options.at(-1) :
    options.find(item => item.dataset.value && item.getAttribute('aria-selected') === 'true') || options[0];
  selected.focus({preventScroll:true});
  selected.scrollIntoView({block:'nearest'});
}

for (const control of filters) {
  const wrapper = control.closest('.filter');
  const trigger = wrapper.querySelector('.filter-trigger');
  const menu = wrapper.querySelector('.filter-menu');
  const list = menu.querySelector('.filter-options');
  const search = menu.querySelector('input[type="search"]');
  const empty = menu.querySelector('.filter-empty');
  const options = [...control.options].map(option => {
    const item = document.createElement('button');
    item.type = 'button';
    item.tabIndex = -1;
    item.className = 'filter-option';
    item.setAttribute('role', 'option');
    item.dataset.value = option.value;
    const icon = (control === platform ? platformIcons : control === emotion ? emotionIcons : null)?.get(option.value);
    if (icon) item.append(icon.cloneNode());
    item.append(option.text);
    list.append(item);
    item.addEventListener('click', () => {
      if (!control.multiple || !option.value) control.value = option.value;
      else {
        control.options[0].selected = false;
        option.selected = !option.selected;
      }
      filterComments();
      if (!control.multiple) closePicker(true);
    });
    return item;
  });
  const picker = {control, wrapper, trigger, menu, options, search, empty};
  filterPickers.set(control, picker);

  if (search) search.addEventListener('input', () => filterOptions(picker));
  trigger.addEventListener('click', () => {
    if (openPicker === picker) closePicker(true);
    else showPicker(picker);
  });
  trigger.addEventListener('keydown', event => {
    if (event.key === 'ArrowDown' || event.key === 'ArrowUp') {
      event.preventDefault();
      showPicker(picker, event.key === 'ArrowUp');
    }
  });
  menu.addEventListener('keydown', event => {
    if (event.isComposing) return;
    if (event.key === 'Tab') {
      closePicker(true);
      return;
    }
    const visible = options.filter(item => !item.hidden);
    const focus = document.activeElement;
    if (search && focus === search) {
      if (event.key === 'ArrowDown' || event.key === 'ArrowUp') {
        event.preventDefault();
        (event.key === 'ArrowDown' ? visible[0] : visible.at(-1))?.focus();
      } else if (event.key === 'Enter' && search.value) {
        event.preventDefault();
        visible[0]?.click();
      }
      return;
    }
    const index = visible.indexOf(focus);
    const last = visible.length - 1;
    if (search && index === 0 && event.key === 'ArrowUp') {
      event.preventDefault();
      search.focus();
      return;
    }
    const next = {ArrowDown:Math.min(last, index+1), ArrowUp:Math.max(0,index-1), Home:0, End:last}[event.key];
    if (next === undefined) return;
    event.preventDefault();
    visible[next]?.focus();
  });
}
document.addEventListener('pointerdown', event => {
  if (openPicker && !openPicker.wrapper.contains(event.target)) closePicker();
});
document.addEventListener('keydown', event => {
  if (event.key === 'Escape' && openPicker && !event.isComposing) {
    event.preventDefault();
    closePicker(true);
  }
});

function updateFilterPickers() {
  for (const [control, {wrapper, trigger, options}] of filterPickers) {
    const values = selectedValues(control);
    const selected = new Set(values);
    const labels = [...control.selectedOptions].filter(option => option.value).map(option => option.text);
    const fullLabel = labels.join('、') || '全部';
    const name = trigger.querySelector('.filter-name').textContent;
    wrapper.classList.toggle('is-active', values.length > 0);
    trigger.querySelector('.filter-value').textContent = labels.length > 1 ? labels.length + ' 项' : fullLabel;
    trigger.setAttribute('aria-label', name + '：' + fullLabel);
    trigger.title = fullLabel;
    for (const option of options) {
      const value = option.dataset.value;
      option.setAttribute('aria-selected', String(value ? selected.has(value) : !selected.size));
    }
  }
}
updateFilterPickers();

function filterComments() {
  const selectedPlatforms = new Set(selectedValues(platform));
  const selectedEmotions = new Set(selectedValues(emotion));
  const matchingKeywordRows = keyword.value ? rowsByWord.get(keyword.value) : null;
  let visible = 0;
  for (const [index, quote] of quotes.entries()) {
    const matchesPlatform = !selectedPlatforms.size || selectedPlatforms.has(quote.dataset.p);
    const matchesTopic = !topic.value || quote.dataset.t === topic.value;
    const matchesEmotion = !selectedEmotions.size || selectedEmotions.has(quote.dataset.e);
    const matchesKeyword = !keyword.value || matchingKeywordRows?.has(index + 1);
    quote.hidden = !(matchesPlatform && matchesTopic && matchesEmotion && matchesKeyword);
    if (!quote.hidden) visible += 1;
  }
  document.querySelector('#match-count').textContent = visible + ' 条评论';
  emptyMessage.hidden = visible > 0;
  resetFilters.hidden = filters.every(control => !selectedValues(control).length);
  updateFilterPickers();
  stream.scrollTop = 0;
}
for (const control of filters) control.addEventListener('change', filterComments);
resetFilters.addEventListener('click', () => {
  for (const control of filters) control.value = '';
  filterPickers.get(platform).trigger.focus({preventScroll:true});
  filterComments();
});
</script></body></html>
