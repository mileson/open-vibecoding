name: Run a feature acceptance suite

on:
  workflow_call:
    inputs:
      runner:
        type: string
        required: true
      engine:
        type: string
        required: true
      manifest:
        type: string
        required: true
      run-id:
        type: string
        required: true
      setup-script:
        type: string
        default: ''
      cleanup-script:
        type: string
        default: ''
      cli-script:
        type: string
        default: bin/open-vibecoding.js
      verify-photo-selection:
        type: boolean
        default: false
      allow-retry-recovery:
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  feature-acceptance:
    name: Feature acceptance
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 45
    env:
      E2E_ENGINE: ${{ inputs.engine }}
      E2E_MANIFEST: ${{ inputs.manifest }}
      E2E_RUN_ID: ${{ inputs.run-id }}
      E2E_SETUP: ${{ inputs.setup-script }}
      E2E_CLEANUP: ${{ inputs.cleanup-script }}
      E2E_CLI: ${{ inputs.cli-script }}
      E2E_ALLOW_RETRY: ${{ inputs.allow-retry-recovery }}
      MAESTRO_CLI_ANALYSIS_NOTIFICATION_DISABLED: 'true'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'
          package-manager-cache: false
      - name: Set up Java for Maestro
        if: ${{ inputs.engine == 'maestro' }}
        id: java
        continue-on-error: true
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Prepare test environment
        timeout-minutes: 14
        id: setup
        continue-on-error: true
        shell: bash
        env:
          E2E_JAVA_OUTCOME: ${{ steps.java.outcome }}
        run: |
          report="$RUNNER_TEMP/feature-acceptance"
          mkdir -p "$report"
          (
            set -e
            npm ci
            if [[ "$E2E_ENGINE" == maestro && "$E2E_JAVA_OUTCOME" != success ]]; then
              echo 'Java setup failed. See the Set up Java for Maestro step.'
              exit 1
            fi
            if [[ -n "$E2E_SETUP" ]]; then bash "$E2E_SETUP"; fi
          ) 2>&1 | tee "$report/setup.log"
      - name: Run registered acceptance cases
        env:
          E2E_SETUP_OUTCOME: ${{ steps.setup.outcome }}
        shell: bash
        run: |
          report="$RUNNER_TEMP/feature-acceptance"
          args=()
          if [[ "$E2E_SETUP_OUTCOME" != success ]]; then
            args+=(--setup-error '环境准备失败，详见 setup.log')
          fi
          status=0
          node "$E2E_CLI" test-report e2e --data "$E2E_MANIFEST" --run "$E2E_RUN_ID" --out "$report" "${args[@]}" || status=$?
          if ! test -f "$report/results.json"; then
            echo 'E2E environment error: no machine-readable result.' >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          outcome="$(jq -er --arg id "$E2E_RUN_ID" --arg engine "$E2E_ENGINE" \
            '.runs[] | select(.id == $id and .engine == $engine) | .status' "$report/results.json")"
          printf 'E2E (%s): `%s`\n' "$E2E_ENGINE" "$outcome" >> "$GITHUB_STEP_SUMMARY"
          if [[ "$status" != 0 ]]; then exit "$status"; fi
          if [[ "$outcome" == passed_on_retry && "$E2E_ALLOW_RETRY" != true ]]; then
            echo 'The required baseline must pass on its first attempt.' >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          [[ "$outcome" == passed || "$outcome" == passed_on_retry ]]
      - name: Verify fixed-sample controls
        if: ${{ inputs.verify-photo-selection }}
        shell: bash
        run: |
          report="$RUNNER_TEMP/feature-acceptance"
          run_sample() {
            local name="$1"
            local expected_exit="$2"
            shift 2
            local status=0
            node "$E2E_CLI" test-report e2e --data "$E2E_MANIFEST" \
              --out "$report/$name" "$@" || status=$?
            [[ "$status" == "$expected_exit" ]]
          }
          run_sample defect-count 0 --run "$E2E_ENGINE-defect-count"
          run_sample defect-identity 1 --run "$E2E_ENGINE-defect-identity"
          if [[ "$E2E_ENGINE" == playwright ]]; then
            PHOTO_FIXTURE_OMIT_ID=P10 run_sample missing-photo 1 --run "$E2E_RUN_ID"
          fi
          node scripts/ci-e2e-photo-selection-eval.mjs "$report" "$E2E_ENGINE" "$E2E_RUN_ID" \
            | tee "$report/eval.json"
          printf 'Tested candidate: `%s` (`%s`)\n' "$GITHUB_SHA" "$GITHUB_REF" >> "$GITHUB_STEP_SUMMARY"
          cat "$report/eval.json" >> "$GITHUB_STEP_SUMMARY"
      - name: Release task resources
        timeout-minutes: 2
        if: ${{ always() && inputs.cleanup-script != '' }}
        shell: bash
        run: bash "$E2E_CLEANUP" cleanup
      - name: Upload report and raw evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: e2e-${{ inputs.run-id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/feature-acceptance
            !${{ runner.temp }}/feature-acceptance/**/.fixture/**
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 14
